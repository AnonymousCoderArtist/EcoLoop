[project]
name = "ecoloop-backend"
version = "0.1.0"
description = "EcoLoop — outcome-based waste behaviour platform backend (Flask + Gemini Vision)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask==3.1.0",
    "Flask-Cors==5.0.0",
    "google-genai==1.21.0",
    "python-dotenv==1.0.1",
    "Pillow>=11.3.0",
]

[tool.uv]
managed = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
